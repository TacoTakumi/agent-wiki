<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }}{% endblock %} - Agent Wiki</title>
{# Inlined, not linked: pages load no external CSS. #}
<style>
{% include "simple.css" %}
{% include "github-markdown.css" %}
{% include "viewer.css" %}
</style>
</head>
<body>
<header>
<nav><a href="/">Vaults</a></nav>
{% block search_form %}
<form method="get" action="/search" role="search">
<input type="search" name="q" aria-label="Search all vaults">
<button type="submit">Search</button>
</form>
{% endblock %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
