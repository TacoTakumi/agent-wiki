<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }}{% endblock %} - Agent Wiki</title>
{# Inlined, not linked: pages load no external CSS. #}
<style>
{% include "github-markdown.css" %}
{% include "viewer.css" %}
</style>
</head>
<body>
<header class="site-header">
<div class="container">
<nav><a href="/">Vaults</a></nav>
{% block search_form %}
<form method="get" action="/search" role="search">
<input type="search" name="q" aria-label="Search all vaults">
<button type="submit">Search</button>
</form>
{% endblock %}
<form class="theme" method="post" action="/theme" aria-label="Theme">
<input type="hidden" name="next" value="{{ theme_next }}">
{% for value in themes %}
<button name="theme" value="{{ value }}" aria-pressed="{{ 'true' if value == theme else 'false' }}">{{ value | capitalize }}</button>
{% endfor %}
</form>
</div>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
